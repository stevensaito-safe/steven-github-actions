name: Deploy Bitwarden Onboarding Lambda

on:
  # pull_request:
  push:
    branches: [main]
    # paths:
      # - 'steven-github-actions/**'

permissions:
  id-token: write   # required for OIDC
  contents: read    # required to check out the repository

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: bitwarden-lambda
  FUNCTION_NAME: techops-onboard-bitwarden-prod-index
  WORKING_DIR: steven-github-actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # match your Lambda runtime

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-TEST.txt

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588146318465:role/TechOps-github-actions-lambda-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ${{ env.WORKING_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Smoke test invoke
        run: |
          aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }} \
            --payload '{}' \
            response.json
          cat response.json