name: Deploy Lambda

on:
  push:
    branches: [main]   # ´runs after PR is merged into main

permissions:
  id-token: write   # required for OIDC
  contents: read  # Required to check out the repository

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # match whatever runtime your Lambda uses

      # in your GitHub Actions workflow, before `chalice deploy`
      # - name: Download Bitwarden CLI
      #   run: |
      #     mkdir -p vendor
      #     unzip bw.zip -d vendor/
      #     chmod +x vendor/bw

      # - name: Download Bitwarden CLI
      #   run: |
      #     mkdir -p vendor
      #     curl -Lo bw.zip "https://vault.bitwarden.com/download/?app=cli&platform=linux"
      #     unzip bw.zip -d vendor/
      #     chmod +x vendor/bw
      #     rm bw.zip

      # - name: Install Bitwarden CLI via npm
      #   run: |
      #     mkdir -p vendor
      #     npm install @bitwarden/cli --prefix ./bw-install
      #     cp ./bw-install/node_modules/.bin/bw vendor/bw
      #     chmod +x vendor/bw

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588146318465:role/TechOps-github-actions-lambda-deploy
          aws-region: us-west-2

      - name: Build and publish Bitwarden layer
        id: bw_layer
        run: |
          mkdir -p layer/bin
          curl -Lo bw.zip "https://vault.bitwarden.com/download/?app=cli&platform=linux"
          unzip bw.zip -d layer/bin/
          chmod +x layer/bin/bw
          cd layer && zip -r ../bw-layer.zip . && cd ..

          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name bitwarden-cli \
            --zip-file fileb://bw-layer.zip \
            --compatible-runtimes python3.12 \
            --compatible-architectures x86_64 \
            --query 'LayerVersionArn' --output text)

          echo "layer_arn=$LAYER_ARN" >> $GITHUB_OUTPUT

      - name: Inject layer ARN into Chalice config
        run: |
          python - <<EOF
          import json
          with open(".chalice/config.json") as f:
              config = json.load(f)
          config["stages"]["${{ steps.stage.outputs.stage }}"]["lambda_functions"]["your-function-name"]["layers"] = ["${{ steps.bw_layer.outputs.layer_arn }}"]
          with open(".chalice/config.json", "w") as f:
              json.dump(config, f, indent=2)
          EOF

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
          else
            echo "stage=prod" >> $GITHUB_OUTPUT
          fi

      - name: Prepare requirements.txt for Chalice
        run: |
          if [ "${{ steps.stage.outputs.stage }}" = "prod" ]; then
            cp requirements-PROD.txt requirements.txt
          else
            cp requirements-TEST.txt requirements.txt
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ steps.stage.outputs.stage }}" = "prod" ]; then
            pip install -r requirements-PROD.txt
          else
            pip install -r requirements-TEST.txt
          fi
          pip install chalice


      - name: Deploy with Chalice
        run: chalice deploy --stage ${{ steps.stage.outputs.stage }}
