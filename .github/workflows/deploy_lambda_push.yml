  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # match whatever runtime your Lambda uses

      - name: Install dependencies into package folder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-PROD.txt -t package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588146318465:role/GitHubActionS3Access
          aws-region: us-west-2

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset